<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Page Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Times+New+Roman&display=swap" rel="stylesheet">
    <style>
        /* Base styles for the app */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Formal styling for the A4 Preview */
        .formal-text {
            font-family: 'Times New Roman', Times, serif;
        }

        /* A4 Page Dimensions and styling for screen */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            padding: 25mm 20mm;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            /* Hide the sidebar/form completely */
            #sidebar, #print-btn {
                display: none !important;
            }
            /* Reset the preview container layout for printing */
            #preview-container {
                width: 100%;
                margin: 0;
                padding: 0;
                background: transparent;
                display: block;
                overflow: visible;
            }
            /* Ensure the A4 page fits exactly onto the physical paper */
            .a4-page {
                width: 210mm;
                height: 297mm;
                min-height: 297mm;
                box-shadow: none;
                margin: 0;
                padding: 25mm 20mm;
                transform: scale(1) !important;
            }
        }
        
        /* Custom scrollbar for the sidebar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Left Column: Form Section -->
    <aside id="sidebar" class="w-full md:w-[400px] lg:w-[450px] bg-white border-r border-gray-200 h-full overflow-y-auto z-10 flex flex-col shadow-lg shrink-0">
        <div class="p-6 border-b border-gray-100 bg-gray-50 flex justify-between items-center sticky top-0 z-20">
            <h1 class="text-xl font-bold text-gray-800">Cover Page Setup</h1>
            <button id="print-btn" onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md shadow text-sm font-medium transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                Print to PDF
            </button>
        </div>

        <div class="p-6 space-y-6">
            <!-- Logo File Path -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Logo File Path</label>
                <input type="text" id="logo-input" value="logo.png" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Document Details -->
            <div class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Document Details</h2>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Document Type</label>
                    <select id="doc-type" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="Assignment">Assignment</option>
                        <option value="Lab Report">Lab Report</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Document Title/Topic</label>
                    <input type="text" id="doc-title" placeholder="e.g. Data Structures and Algorithms" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Document Number</label>
                    <input type="text" id="doc-number" placeholder="e.g. 01" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- Teacher Details -->
            <div class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Submitted To (Teacher)</h2>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Designation</label>
                    <select id="teacher-desig" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="Professor">Professor</option>
                        <option value="Assistant Professor">Assistant Professor</option>
                        <option value="Lecturer">Lecturer</option>
                        <option value="Guest Lecturer">Guest Lecturer</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Teacher Name</label>
                    <input type="text" id="teacher-name" placeholder="Name of the teacher" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Department</label>
                    <input type="text" id="teacher-dept" value="Computer Science & Engineering" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">University Name</label>
                    <input type="text" id="uni-name" value="Port City International University" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- Student Details -->
            <div class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Submitted By (Student)</h2>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Student Name</label>
                    <input type="text" id="student-name" placeholder="Full Name" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Student ID</label>
                        <input type="text" id="student-id" placeholder="e.g. CSE 000 0000" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Batch</label>
                        <input type="text" id="student-batch" value="31-D-A" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Department</label>
                    <input type="text" id="student-dept" value="Computer Science & Engineering" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Program</label>
                    <input type="text" id="student-program" value="B.Sc. in CSE" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- Course & Misc Details -->
            <div class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Course & Submission</h2>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Course Code & Title</label>
                    <input type="text" id="course-code" placeholder="e.g. CSE-101: Introduction" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Date of Submission</label>
                    <input type="date" id="submit-date" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
            
            <div class="pb-8"></div>
        </div>
    </aside>

    <!-- Right Column: Live A4 Preview Section -->
    <main id="preview-container" class="flex-1 bg-gray-200 overflow-y-auto flex justify-center items-start py-10 px-4 md:px-10">
        
        <div id="a4-content" class="a4-page formal-text text-black">
            
            <!-- Logo Section -->
            <div class="w-full flex justify-center mb-6">
                <img id="prev-logo" src="https://placehold.co/150x150/ffffff/cccccc?text=Logo" alt="University Logo" class="h-32 object-contain max-w-[250px]">
            </div>

            <!-- University Name Header -->
            <h1 id="prev-uni-header" class="text-3xl font-bold uppercase tracking-wide text-center mb-10 w-full whitespace-pre-wrap leading-tight"></h1>

            <!-- Document Headers -->
            <div class="w-full text-center mb-16 space-y-4">
                <h2 class="text-2xl font-bold uppercase border-b-2 border-black pb-2 inline-block px-10">
                    <span id="prev-doc-type-label">Assignment</span>
                </h2>
                
                <div class="text-xl">
                    <span class="font-bold"><span id="prev-doc-type-title-label">Assignment</span> Topic:</span>
                    <span id="prev-doc-title" class="ml-2 font-medium"></span>
                </div>
                
                <div class="text-xl">
                    <span class="font-bold"><span id="prev-doc-type-num-label">Assignment</span> No:</span>
                    <span id="prev-doc-num" class="ml-2 font-medium"></span>
                </div>
                
                <div class="text-xl mt-4">
                    <span class="font-bold">Course:</span>
                    <span id="prev-course" class="ml-2 font-medium"></span>
                </div>
            </div>

            <!-- Submitted To & By Columns -->
            <div class="w-full flex justify-between px-8 mb-16">
                
                <!-- Submitted To -->
                <div class="w-[45%]">
                    <h3 class="text-xl font-bold underline mb-4">Submitted To:</h3>
                    <div class="text-lg leading-relaxed">
                        <p class="font-bold mb-1"><span id="prev-teacher-desig"></span> <span id="prev-teacher-name"></span></p>
                        <p id="prev-teacher-dept-display"></p>
                        <p id="prev-teacher-uni-display"></p>
                    </div>
                </div>

                <!-- Submitted By -->
                <div class="w-[45%] border-l-2 border-gray-300 pl-8">
                    <h3 class="text-xl font-bold underline mb-4">Submitted By:</h3>
                    <div class="text-lg leading-relaxed">
                        <p><span class="font-bold">Name:</span> <span id="prev-student-name-display"></span></p>
                        <p><span class="font-bold">ID:</span> <span id="prev-student-id-display"></span></p>
                        <p><span class="font-bold">Batch:</span> <span id="prev-student-batch-display"></span></p>
                        <p><span class="font-bold">Department:</span> <span id="prev-student-dept-display"></span></p>
                        <p><span class="font-bold">Program:</span> <span id="prev-student-prog-display"></span></p>
                    </div>
                </div>
            </div>

            <!-- Spacer to push date to bottom if needed -->
            <div class="flex-grow"></div>

            <!-- Date of Submission -->
            <div class="w-full text-center mt-auto border-t-2 border-gray-300 pt-4">
                <p class="text-xl">
                    <span class="font-bold">Date of Submission:</span>
                    <span id="prev-date-display" class="ml-2 font-medium"></span>
                </p>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Input Elements
            const inputs = {
                logo: document.getElementById('logo-input'),
                docType: document.getElementById('doc-type'),
                docTitle: document.getElementById('doc-title'),
                docNumber: document.getElementById('doc-number'),
                
                teacherDesig: document.getElementById('teacher-desig'),
                teacherName: document.getElementById('teacher-name'),
                teacherDept: document.getElementById('teacher-dept'),
                uniName: document.getElementById('uni-name'),
                
                studentName: document.getElementById('student-name'),
                studentId: document.getElementById('student-id'),
                studentBatch: document.getElementById('student-batch'),
                studentDept: document.getElementById('student-dept'),
                studentProgram: document.getElementById('student-program'),
                
                courseCode: document.getElementById('course-code'),
                submitDate: document.getElementById('submit-date')
            };

            // Preview Elements
            const previews = {
                logo: document.getElementById('prev-logo'),
                uniHeader: document.getElementById('prev-uni-header'),
                docTypeLabel: document.getElementById('prev-doc-type-label'),
                docTypeTitleLabel: document.getElementById('prev-doc-type-title-label'),
                docTypeNumLabel: document.getElementById('prev-doc-type-num-label'),
                docTitle: document.getElementById('prev-doc-title'),
                docNum: document.getElementById('prev-doc-num'),
                course: document.getElementById('prev-course'),
                
                teacherDesig: document.getElementById('prev-teacher-desig'),
                teacherName: document.getElementById('prev-teacher-name'),
                teacherDept: document.getElementById('prev-teacher-dept-display'),
                teacherUni: document.getElementById('prev-teacher-uni-display'),
                
                studentName: document.getElementById('prev-student-name-display'),
                studentId: document.getElementById('prev-student-id-display'),
                studentBatch: document.getElementById('prev-student-batch-display'),
                studentDept: document.getElementById('prev-student-dept-display'),
                studentProg: document.getElementById('prev-student-prog-display'),
                
                dateDisplay: document.getElementById('prev-date-display')
            };

            // Set current date as default
            const today = new Date().toISOString().split('T')[0];
            inputs.submitDate.value = today;

            // Function to update the preview
            function updatePreview() {
                const docTypeVal = inputs.docType.value;
                
                previews.logo.src = inputs.logo.value || 'logo.png';
                
                previews.uniHeader.textContent = inputs.uniName.value || 'University Name';
                
                previews.docTypeLabel.textContent = docTypeVal;
                previews.docTypeTitleLabel.textContent = docTypeVal;
                previews.docTypeNumLabel.textContent = docTypeVal;
                
                previews.docTitle.textContent = inputs.docTitle.value || '______________';
                previews.docNum.textContent = inputs.docNumber.value || '______________';
                previews.course.textContent = inputs.courseCode.value || '______________';

                previews.teacherDesig.textContent = inputs.teacherDesig.value;
                previews.teacherName.textContent = inputs.teacherName.value || '______________';
                previews.teacherDept.textContent = "Department of " + (inputs.teacherDept.value || '______________');
                previews.teacherUni.textContent = inputs.uniName.value || '______________';

                previews.studentName.textContent = inputs.studentName.value || '______________';
                previews.studentId.textContent = inputs.studentId.value || '______________';
                previews.studentBatch.textContent = inputs.studentBatch.value || '______________';
                previews.studentDept.textContent = inputs.studentDept.value || '______________';
                previews.studentProg.textContent = inputs.studentProgram.value || '______________';

                // Format Date nicely
                if(inputs.submitDate.value) {
                    const dateObj = new Date(inputs.submitDate.value);
                    previews.dateDisplay.textContent = dateObj.toLocaleDateString('en-GB', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });
                } else {
                    previews.dateDisplay.textContent = '______________';
                }
            }

            // Listen for input changes to update preview immediately
            Object.values(inputs).forEach(input => {
                input.addEventListener('input', updatePreview);
                input.addEventListener('change', updatePreview);
            });

            // Initial render
            updatePreview();
        });
    </script>
</body>
</html>
